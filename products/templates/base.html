{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plantilla base{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'producto/css/styles.css' %}">
</head>
<body class="p-3">
    <header class="d-flex justify-content-between align-items-center" style="background-color: blue;">
        <img class="img image" style="max-width: 100px;" src="{% static 'producto/img/logo.webp' %}" alt="">
        <h1>{{product}} - Tiendita</h1>
    </header>
    
    <main>
        {% block content %}

        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>
            Tiendita - 2026
        </p>
    </footer>
    <script src="{% static 'producto/js/main.js' %}"></script>
</body>
</html>
